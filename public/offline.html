<!doctype html>
<!-- The iOS/iPad app shows this bundled page when the live site cannot be loaded (no network at the
     aerodrome): capacitor.config.ts server.errorPath. "Try again" asks the app to load the live site
     again (PgfNativePlugin.reload); coming back online does the same. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Pig's Gotta Fly</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #f5f6f8; color: #16191d;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    box-sizing: border-box; -webkit-user-select: none; user-select: none;
  }
  main { max-width: 340px; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font-size: 20px; font-weight: 600; margin: 20px 0 6px; }
  p { color: #4a5059; margin: 0 0 24px; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: #1f5fbf;
    border: 0; border-radius: 10px; padding: 12px 28px; min-width: 160px;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: #194f9f; }
  button:disabled { opacity: 0.6; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>No connection</h1>
  <p>Pig's Gotta Fly needs the internet to open. Check your connection and try again.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  var button = document.getElementById('retry');
  function retry() {
    button.disabled = true;
    button.textContent = 'Connecting…';
    var cap = window.Capacitor;
    if (cap && cap.nativePromise) {
      cap.nativePromise('PgfNative', 'reload', {}).catch(function () { location.href = 'https://pigsgottafly.com/'; });
    } else {
      location.href = location.protocol === 'capacitor:' ? 'https://pigsgottafly.com/' : '/';
    }
    // still here (the load is slow or failed quietly): let the pilot try again
    setTimeout(function () { button.disabled = false; button.textContent = 'Try again'; }, 15000);
  }
  button.addEventListener('click', retry);
  window.addEventListener('online', retry);
</script>
</body>
</html>
