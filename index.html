<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1546a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pig's Gotta Fly</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css?v=3668d5f5a9">
</head>
<body class="loading">

<!-- ================================================================ home -->
<section id="home" class="no-print" hidden>
  <header class="home-top">
    <div class="brand"><img src="icon.svg" alt=""><span>Pig's Gotta Fly</span></div>
    <input id="search" type="search" placeholder="Search flights" autocomplete="off" spellcheck="false">
    <span class="spacer"></span>
    <div class="account" hidden></div>
  </header>
  <div class="starts">
    <div class="starts-inner">
      <h2>Start a new flight</h2>
      <div class="tiles">
        <button class="tile" id="new-blank"><span class="tile-art blank"><svg viewBox="0 0 48 48"><path d="M24 12v24M12 24h24" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></span><span class="tile-label">Blank flight</span></button>
        <button class="tile" id="new-windy"><span class="tile-art windy"><svg viewBox="0 0 48 48"><path d="M10 34 L20 18 L30 26 L38 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="10" cy="34" r="3.2" fill="currentColor"/><circle cx="20" cy="18" r="3.2" fill="currentColor"/><circle cx="30" cy="26" r="3.2" fill="currentColor"/><circle cx="38" cy="12" r="3.2" fill="currentColor"/></svg></span><span class="tile-label">From Windy route</span></button>
      </div>
    </div>
  </div>
  <main class="flights">
    <div id="flight-list"></div>
    <p id="empty" class="empty" hidden>No flights yet.</p>
  </main>
</section>

<!-- ================================================================ flight -->
<section id="flight" hidden>
  <header class="doc-top no-print" id="bar">
    <a class="back" href="#/" title="All flights" aria-label="All flights"><img src="icon.svg" alt=""></a>
    <div class="doc-head">
      <div class="doc-title-row">
        <input id="title" class="doc-title" spellcheck="false" autocomplete="off" aria-label="Flight name">
        <span id="save-state" class="save-state"></span>
      </div>
      <nav class="menubar" id="menubar">
        <div class="menu-wrap"><button class="menu-btn" data-menu="file">File</button>
          <div class="menu" data-menu="file" hidden>
            <button id="btn-new"><span>New flight</span></button>
            <button id="btn-copy"><span>Make a copy</span></button>
            <hr>
            <a id="btn-open-windy" target="_blank" rel="noopener" href="https://www.windy.com/route-planner/vfr?37.9,23.6,8"><span>Open route in Windy</span></a>
            <button id="btn-print-menu"><span>Print</span><kbd>⌘P</kbd></button>
            <hr>
            <button id="btn-export"><span>Download file</span></button>
            <label id="btn-import" class="menu-label"><span>Open file…</span><input id="file-import" type="file" accept="application/json" hidden></label>
            <hr>
            <button id="btn-delete"><span>Move to trash</span></button>
          </div>
        </div>
        <div class="menu-wrap"><button class="menu-btn" data-menu="edit">Edit</button>
          <div class="menu" data-menu="edit" hidden>
            <button id="btn-undo"><span>Undo</span><kbd>⌘Z</kbd></button>
            <button id="btn-redo"><span>Redo</span><kbd>⇧⌘Z</kbd></button>
            <hr>
            <button id="btn-reverse"><span>Reverse route</span></button>
            <button id="btn-restore-rows"><span>Restore removed rows</span></button>
            <button id="btn-clear-edits"><span>Clear my edits</span></button>
          </div>
        </div>
        <div class="menu-wrap"><button class="menu-btn" data-menu="flight">Flight</button>
          <div class="menu" data-menu="flight" hidden>
            <button id="btn-route"><span>Change route…</span></button>
            <button id="btn-winds"><span>Refresh weather</span></button>
            <hr>
            <button id="btn-settings"><span>Settings…</span></button>
          </div>
        </div>
      </nav>
    </div>
    <div class="doc-tools">
      <span id="chips" class="chips"></span>
      <input id="date" type="text" placeholder="YYYY-MM-DD" maxlength="10" inputmode="numeric" spellcheck="false" title="Date">
      <input id="block-start" type="text" placeholder="Block Z" maxlength="6" inputmode="numeric" title="Block start (UTC)">
      <select id="aircraft" title="Aircraft">
        <option value="SX-ASV">SX-ASV</option>
        <option value="SX-ASG">SX-ASG</option>
        <option value="OTHER">Other…</option>
      </select>
      <input id="aircraft-other" type="text" placeholder="SX-…" hidden spellcheck="false" title="Registration">
      <span id="pager" class="pager" hidden><button id="pg-prev" title="Previous sheet">‹</button><span id="pg-label"></span><button id="pg-next" title="Next sheet">›</button></span>
      <button id="btn-print" class="primary">Print</button>
      <div class="account" hidden></div>
    </div>
  </header>
  <main id="stage"><div id="sheet"></div></main>
</section>

<!-- ================================================================ dialogs -->
<dialog id="route-dialog" class="no-print">
  <form method="dialog">
    <h2>Route from Windy</h2>
    <input id="windy-url" type="text" placeholder="Paste the route planner link" spellcheck="false" autocomplete="off">
    <p id="route-hint" class="route-hint"></p>
    <div class="dialog-foot">
      <a class="link" target="_blank" rel="noopener" href="https://www.windy.com/route-planner/vfr?37.9,23.6,8">Open Windy</a>
      <span class="spacer"></span>
      <button value="ok" id="route-ok" class="primary">OK</button>
      <button value="cancel" class="ghost" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="settings" class="no-print">
  <form method="dialog">
    <h2>Settings</h2>
    <div class="grid2">
      <label id="card-wrap">Compass card <select id="card"></select><small id="card-info"></small></label>
      <label>Wind model <select id="model"></select></label>
      <label>Taxi time (min) <input id="taxi-min" type="number" min="0" max="60" step="1"></label>
      <label>Magnetic variation <span class="pair"><input id="variation" type="number" min="0" step="0.5"><select id="variation-ew"><option>E</option><option>W</option></select></span></label>
      <label>Fuel flow (L/h) <input id="fuel-flow" type="number" min="1" step="1"></label>
      <label>Taxi fuel (L) <input id="fuel-extra" type="number" min="0" step="1"></label>
      <label>List aerodromes within (NM of route) <input id="field-radius" type="number" min="0" step="0.5"></label>
    </div>
    <details class="about"><summary>About</summary><p id="data-note"></p></details>
    <div class="dialog-foot"><span class="spacer"></span><button value="close" class="primary close">Done</button></div>
  </form>
</dialog>

<dialog id="rename-dialog" class="no-print">
  <form method="dialog">
    <h2>Rename</h2>
    <input id="rename-input" type="text" spellcheck="false" autocomplete="off">
    <div class="dialog-foot"><span class="spacer"></span><button value="ok" class="primary">OK</button><button value="cancel" class="ghost" formnovalidate>Cancel</button></div>
  </form>
</dialog>

<div id="login" class="login no-print" hidden>
  <div class="login-card">
    <img src="icon.svg" alt="">
    <h1>Pig's Gotta Fly</h1>
    <div id="google-button" class="google-button"></div>
    <p id="login-error" class="login-error" hidden></p>
  </div>
</div>

<div id="cal" class="cal no-print" hidden>
  <div class="cal-head"><button type="button" class="cal-nav" data-step="-1" aria-label="Previous month">‹</button><span id="cal-title"></span><button type="button" class="cal-nav" data-step="1" aria-label="Next month">›</button></div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="cal-foot"><button type="button" id="cal-today">Today</button></div>
</div>
<div id="toast" class="toast no-print" hidden><span id="toast-text"></span><button id="toast-action" class="toast-action"></button></div>
<div id="row-menu" class="menu row-menu no-print" hidden>
  <button data-act="open"><span>Open</span></button>
  <button data-act="tab"><span>Open in new tab</span></button>
  <button data-act="rename"><span>Rename</span></button>
  <button data-act="copy"><span>Make a copy</span></button>
  <hr>
  <button data-act="delete"><span>Move to trash</span></button>
</div>

<script src="data/aip.js?v=67d702466e"></script>
<script src="data/sun.js?v=706d3b18d0"></script>
<script src="data/vfr.js?v=00c9c0d2b3"></script>
<script src="js/aircraft.js?v=555adac0d2"></script>
<script src="js/nav.js?v=76318bd424"></script>
<script src="js/weather.js?v=15db0c1ae1"></script>
<script src="js/store.js?v=dfe03aca83"></script>
<script src="js/app.js?v=69ad478227"></script>
</body>
</html>
